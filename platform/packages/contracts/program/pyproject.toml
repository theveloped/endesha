[project]
name = "wf-contracts-program"
version = "0.1.0"
description = "WF platform L1: program runner contract (PackML unit + program state, catalog, commands)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
