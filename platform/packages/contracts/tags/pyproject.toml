[project]
name = "wf-contracts-tags"
version = "0.1.0"
description = "WF platform L1: tags contract (named typed PLC/controller variables) keys and messages"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
