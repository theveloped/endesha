[project]
name = "wf-hal-arm-dio"
version = "0.1.0"
description = "WF platform L2: dio provider that fronts an arm's onboard IO bank over the bus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-arm",
    "wf-contracts-dio",
    "wf-hal-dio-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
