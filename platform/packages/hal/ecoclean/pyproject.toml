[project]
name = "wf-hal-ecoclean"
version = "0.1.1"
description = "WF platform L2: Ecoclean parts-washer HAL (washer contract) — sim PLC and live over OPC-UA; provides the raw tags device"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-control",
    "wf-contracts-tags",
    "wf-contracts-washer",
    "wf-hal-channels-core",
    "wf-hal-tags-core",
    "wf-hal-sim-tags",
    "wf-hal-opcua",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
