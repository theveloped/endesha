[project]
name = "wf-hal-arm-core"
version = "0.1.0"
description = "WF platform L2: shared arm-contract core + backend seam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-world-model",
    "wf-contracts-arm",
    "wf-contracts-control",
    "wf-contracts-dio",
    "wf-hal-dio-core",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
