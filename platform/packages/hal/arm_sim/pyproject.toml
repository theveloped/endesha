[project]
name = "wf-hal-arm-sim"
version = "0.1.0"
description = "WF platform L2: simulated arm HAL (arm contract, sim realm)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-world-model",
    "wf-contracts-arm",
    "wf-hal-arm-core",
    "wf-hal-aubo-i10",
    "numpy",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
