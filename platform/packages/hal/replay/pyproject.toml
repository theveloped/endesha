[project]
name = "wf-hal-replay"
version = "0.1.0"
description = "WF platform L2: per-device replay providers (replay_arm, replay_camera)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-hal-arm-core",
    "wf-hal-camera2d-core",
    "wf-hal-aubo-i10",
    "wf-services-recording",
    "wf-contracts-arm",
    "wf-contracts-camera2d",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
