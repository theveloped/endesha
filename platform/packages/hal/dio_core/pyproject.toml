[project]
name = "wf-hal-dio-core"
version = "0.1.0"
description = "WF platform L2: shared dio-contract core (channel table, force overlay, lease check) + backend seam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-dio",
    "wf-contracts-control",
    "wf-hal-channels-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
