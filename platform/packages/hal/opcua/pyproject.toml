[project]
name = "wf-hal-opcua"
version = "0.1.0"
description = "WF platform L2: OPC-UA client provider for the tags contract (asyncua)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-tags",
    "wf-hal-tags-core",
    "asyncua>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
