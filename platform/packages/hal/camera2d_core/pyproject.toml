[project]
name = "wf-hal-camera2d-core"
version = "0.1.0"
description = "WF platform L2: shared camera2d-contract core + backend seam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-camera2d",
    "wf-contracts-arm",
    "numpy",
    "opencv-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
