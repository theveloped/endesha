[project]
name = "wf-hal-aubo-i10"
version = "0.1.0"
description = "WF platform L2: Aubo i10 HAL (aubo_driver)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-world-model",
    "wf-contracts-arm",
    "wf-hal-arm-core",
    "pyyaml",
]
# NOTE: pyaubo_sdk is intentionally NOT a declared dependency. The vendor
# binding (0.26.0rc6, cp312 .pyd) is installed by deploy/install_pyaubo.ps1
# and lazy-imported inside functions so this package imports without it.
# (PyPI's pyaubo-sdk tops out at 0.24.1, which lacks moveStop and streams a
# different RTDE surface — prefer the vendor .pyd.)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
