[project]
name = "wf-hal-sim-dio"
version = "0.1.0"
description = "WF platform L2: simulated dio provider (in-memory channels, optional scripted inputs)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-dio",
    "wf-hal-dio-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
