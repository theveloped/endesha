[project]
name = "wf-hal-genicam"
version = "0.1.0"
description = "WF platform L2: GenICam/GigE camera HAL (Harvester, camera2d contract)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-camera2d",
    "wf-contracts-arm",
    "harvesters~=1.4",
    "opencv-python",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
