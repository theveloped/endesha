[project]
name = "wf-hal-browser-camera"
version = "0.1.0"
description = "WF platform L2 browser-produced simulated camera HAL"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-camera2d",
    "wf-hal-camera2d-core",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
