[project]
name = "wf-hal-camera2d-sim"
version = "0.1.0"
description = "WF platform L2: simulated camera HAL (camera2d contract, sim realm)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-world-model",
    "wf-contracts-camera2d",
    "wf-contracts-arm",
    "numpy",
    "opencv-python",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
