[project]
name = "wf-hal-tags-core"
version = "0.1.0"
description = "WF platform L2: tags-contract core (typed named variables) over the generic channels core + backend seam"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-tags",
    "wf-contracts-control",
    "wf-hal-channels-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
