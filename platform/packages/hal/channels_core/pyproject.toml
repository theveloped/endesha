[project]
name = "wf-hal-channels-core"
version = "0.1.0"
description = "WF platform L2: generic named-channel device core (table, force overlay, lease gate, publish) shared by dio and tags"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-control",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
