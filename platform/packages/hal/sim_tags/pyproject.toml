[project]
name = "wf-hal-sim-tags"
version = "0.1.0"
description = "WF platform L2: simulated tags provider (in-memory variables from a declared inventory, optional script)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-tags",
    "wf-hal-tags-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
