[project]
name = "wf-tools"
version = "0.1.0"
description = "WF platform CLI tooling (wfctl)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-arm",
    "wf-contracts-control",
    "wf-contracts-dio",
    "wf-contracts-program",
    "wf-contracts-tags",
    "wf-contracts-washer",
    "wf-contracts-camera2d",
    "wf-services-recording",
    "wf-services-config",
    "wf-world-model",
]

[project.scripts]
wfctl = "wf.tools.wfctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
