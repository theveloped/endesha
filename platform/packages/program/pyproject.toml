[project]
name = "wf-program"
version = "0.1.0"
description = "WF program SDK: Program (python-statemachine StateChart) base + Machine device facade"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-arm",
    "wf-contracts-dio",
    "wf-contracts-control",
    "wf-services-config",
    "python-statemachine>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
