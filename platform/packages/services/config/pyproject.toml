[project]
name = "wf-services-config"
version = "0.1.0"
description = "WF config store service: file-backed realm-less config/** queryables"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
