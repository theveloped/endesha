[project]
name = "wf-services-recording"
version = "0.1.0"
description = "WF recording service: MCAP recorder + replayer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "mcap>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
