[project]
name = "wf-services-task-runner"
version = "0.1.0"
description = "WF task runner: statechart task layer over the bus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-arm",
    "wf-contracts-camera2d",
    "wf-contracts-vision",
    "wf-contracts-task",
    "wf-services-config",
    "python-statemachine",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
