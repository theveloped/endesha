[project]
name = "wf-services-vision"
version = "0.1.0"
description = "WF vision service: frame-processor pipeline runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-camera2d",
    "wf-contracts-vision",
    "numpy",
    "opencv-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
