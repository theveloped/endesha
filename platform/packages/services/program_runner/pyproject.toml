[project]
name = "wf-services-program-runner"
version = "0.1.0"
description = "WF program runner: PackML unit machine hosting one wf.program Program at a time"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-program",
    "wf-contracts-control",
    "wf-contracts-supervisor",
    "wf-contracts-arm",
    "wf-contracts-dio",
    "wf-program",
    "python-statemachine>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
