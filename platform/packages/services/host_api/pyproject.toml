[project]
name = "wf-services-host-api"
version = "0.1.0"
description = "WF platform host API: cell registry + supervisor lifecycle (FastAPI) - the machine-level control plane next to the zenoh bus"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-services-supervisor",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
