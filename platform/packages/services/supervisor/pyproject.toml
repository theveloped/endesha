[project]
name = "wf-services-supervisor"
version = "0.1.0"
description = "WF supervisor: cell bring-up and runtime device source management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-supervisor",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
