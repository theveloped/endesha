[project]
name = "wf-services-supervisor"
version = "0.1.0"
description = "WF supervisor: cell bring-up + sole flow interpreter (role->resource resolution)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-supervisor",
    "wf-contracts-task",
    "wf-contracts-vision",
    "wf-services-task-runner",
    "wf-services-vision",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
