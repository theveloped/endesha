[project]
name = "wf-core"
version = "0.1.0"
description = "WF platform L0: session bootstrap, codecs, action pattern, frame math"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eclipse-zenoh~=1.9.0",
    "cbor2",
    "uuid6",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]

[tool.hatch.build]
artifacts = ["src/wf/core/assets/*.glb"]
