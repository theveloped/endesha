[project]
name = "wf-world-model"
version = "0.1.0"
description = "WF platform L1: shared kinematics, IK, goal validation, trajectory (design §5.10)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "wf-core",
    "wf-contracts-arm",
    "numpy",
    "ruckig",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wf"]
