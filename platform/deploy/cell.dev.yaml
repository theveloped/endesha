# Phase-1 dev cell: the inventory §2.1 cell file reduced to r1 only.
# (`fleet/` does not exist yet; this file stands in until the fleet-readiness
# phase.)
cell_type: vision-pick-cell@0.1
platform: 0.1.0
resources:
  r1:
    contract: arm
    hal: aubo_i10
    params:
      ip: 192.168.188.20
      rpc_port: 30004                 # commands
      rtde_port: 30010                # high-rate state stream
      login: { user: aubo, pass: '123456' }
      servo_cycle_s: 0.005            # falls back to SDK call when present
      joint_limit_margin_rad: 0.01    # inward clamp before validation
      ruckig_defaults:
        vmax: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]        # rad/s
        amax: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0]        # rad/s^2
        jmax: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]  # rad/s^3
      # control lease + hold-to-jog (driver defaults; documented here)
      lease_ttl_s: 30.0               # arbitration TTL; UI renews every 10 s
      jog_vmax: 0.5                   # per-joint jog clamp, rad/s
      jog_acc: 2.0                    # speedJoint acceleration, rad/s^2
      jog_watchdog_s: 0.25            # halt if no jog cmd within this window
      jog_loop_hz: 50                 # driver jog-runner re-issue rate
      jog_damping: 0.05               # cartesian DLS damping
  cam0:
    contract: camera2d
    hal: genicam
    params:
      serial: null                  # null -> first enumerated device
      ip: 192.168.188.30            # informational; GenTL discovers by itself
      mount: flange                 # eye-in-hand on r1 (consumed in frames phase)
      pixel_format: BayerRG8
      cti_path: "C:/Program Files/Teledyne/Spinnaker/cti64/vs2015/Spinnaker_GenTL_v140.cti"
      stream_defaults: { rate_hz: 15.0, scale: 0.25, encoding: jpeg, quality: 75 }
