# `docker compose -f deploy/compose.yaml up` brings up the complete simulated
# cell and frontend: router, bridge, config, supervisor, simulated arm,
# headless-browser camera, and Vite at http://localhost:5173. Switch devices
# between live, replay, and off sources from the UI. For the host hardware
# stack, start only the router and use deploy/start_stack.ps1.
#
# Phase-1 router topology. Dev/tests run peer-to-peer without the router;
# the router is for the multi-host/live-cell topology (and is exercised once
# during the hardware verification gate).
#
# If the exact 1.8.0 tag is absent at pull time, use the newest plain 1.8.x.
# Live-reload our own source by mounting `packages/` over the image copy. The
# Pixi environment runs these sources directly, so restarting a service applies
# Python edits without rebuilding the dependency layer. The mount is read-only.
x-code-mount: &code ../packages:/platform/packages:ro

services:
  zenoh-router:
    image: eclipse/zenoh:1.9.0
    ports:
      - "7447:7447"
    volumes:
      - ./zenoh/zenoh-router.json5:/zenoh.json5:ro
    command: -c /zenoh.json5

  # Browser gateway: the remote-api WebSocket bridge. A zenoh peer of the
  # router that serves ws://127.0.0.1:10000 to the web app (zenoh-ts). The
  # router stays the native-TCP hub; this is the only WS edge. The browser (on
  # the host) connects here; the `web` service below only serves the bundle.
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: wf-bridge:latest
    depends_on: [zenoh-router]
    ports:
      - "127.0.0.1:10000:10000"

  # ── the simulated cell ──────────────────────────────────────────────────
  # The host API is the machine-level control plane (http://localhost:8080):
  # it runs the realm-less config store and the ACTIVE cell's supervisor tree
  # (supervisor -> providers + program runner). Cells are the cell.yaml files
  # under deploy/ (deploy/cell.yaml = "default", deploy/<dir>/cell.yaml =
  # "<dir>") with their runtime/*.yaml overlays; switch from the UI navbar,
  # `wfctl cell activate <id> --runtime <overlay>` or POST /cells/<id>/activate.
  # WF_CELL / WF_RUNTIME pick the cell at start (default: last active, else
  # "default" with the "sim" overlay). The simulated camera is the separate
  # camera2d-headless service because its source is external.
  host-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sim
    image: wf-sim:latest
    depends_on: [zenoh-router]
    environment:
      WF_REALM: cell
      WF_CELL: ${WF_CELL:-}
      WF_RUNTIME: ${WF_RUNTIME:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - *code
      # deploy/ is bind-mounted (cells, overlays, programs, config store,
      # host.yaml) so edits hot-reload and UI edits (frames/poses/TCPs, program
      # files, the active cell) survive `docker compose --build`/recreate.
      - ./:/platform/deploy
    command: ["sh", "-c",
              "python -m wf.services.host_api --deploy deploy --port 8080 --with-config --zenoh-config deploy/zenoh/sim-container.json5 $${WF_CELL:+--activate $$WF_CELL} $${WF_RUNTIME:+--runtime $$WF_RUNTIME}"]

  # The headless-browser camera2d HAL: serves the camera2d contract for cid=cam0
  # by rendering the shared Three.js twin scene under headless Chromium
  # (SwiftShader software WebGL — no GPU passthrough) and publishing over the
  # bridge via zenoh-ts. Replaces the retired pyrender camera2d_sim; cam0's `sim`
  # source is `launch: external` in cell.yaml so the supervisor does NOT spawn a
  # Python camera HAL. Long-running service (not a one-shot).
  camera2d-headless:
    profiles: ["headless-camera"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.headless
    image: wf-camera2d-headless:latest
    depends_on: [bridge, host-api]
    environment:
      WS_URL: ws/bridge:10000
      REALM: cell
      CID: cam0

  # The twin frontend (Vite dev server) with hot-reload. Bind-mounts the host
  # web/ source (live HMR) + packages/ (the URDF/GLB assets sync-assets copies);
  # an anonymous volume masks the host's node_modules with the image's Linux
  # build, and CHOKIDAR_USEPOLLING makes file events cross the Docker bind mount
  # so edits hot-reload. The browser (on the host) loads http://localhost:5173
  # and talks to the bridge at ws://127.0.0.1:10000.
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: wf-web-dev:latest
    depends_on: [bridge]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../web:/platform/web
      - /platform/web/node_modules  # mask host node_modules with the image's (Linux)
      - *code                       # ../packages:ro — sync-assets reads the URDF/GLB sources
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
