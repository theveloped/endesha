# Canonical cell definition (RFC §3): one design-time truth, backend-agnostic.
# A runtime overlay (deploy/runtime/*.yaml) selects the active source mode per
# logical device (live/sim/replay/off); the supervisor realizes cell + overlay
# into the concrete inventory. Replaces the duplicated cell.dev.yaml /
# cell.sim.yaml (retired at the end of the migration).
cell_type: manual-cell@0.1
platform: 0.1.0

# Distributed seams: single node is its own master this slice.
master_node: main

resources:
  r1:
    contract: arm
    model: aubo_i10
    # Shared across every source mode (the sim mirrors live timing + limits so
    # planning/preflight behave identically regardless of backend).
    config:
      joint_limit_margin_rad: 0.01     # inward clamp before validation
      ruckig_defaults:
        vmax: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]        # rad/s
        amax: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0]        # rad/s^2
        jmax: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0]  # rad/s^3
      lease_ttl_s: 30.0                # arbitration TTL; UI renews every 10 s
      jog_vmax: 0.5                    # per-joint jog clamp, rad/s
      jog_acc: 2.0                     # speedJoint acceleration, rad/s^2
      jog_watchdog_s: 0.25            # halt if no jog cmd within this window
      jog_loop_hz: 50                  # driver jog-runner re-issue rate
      jog_damping: 0.05                # cartesian DLS damping
    sources:
      live:
        kind: aubo_i10
        params:
          ip: 192.168.188.20
          rpc_port: 30004              # commands
          rtde_port: 30010            # high-rate state stream
          login: { user: aubo, pass: '123456' }
          servo_cycle_s: 0.005        # falls back to SDK call when present
      sim:
        kind: arm_sim
        params: {}
      replay:
        kind: replay_arm
        params:
          # Operator-set for v1 (runtime selection is step-7 tooling). A missing
          # file surfaces as a status error rather than crashing the provider.
          recording: deploy/recordings/demo.mcap

  cam0:
    contract: camera2d
    model: flir_blackfly
    config:
      mount: flange                   # eye-in-hand on r1
      mount_arm: r1
      mount_xyz: [0.08685228895, 0.06511, 0.029]
      mount_rpy_deg: [90.0, 0.0, 180.0]
      # Physical camera optics shared by every simulated provider.
      render:
        width: 1280
        height: 800
        fx: 900.0
        fy: 900.0
        background_gray: 90
    sources:
      live:
        kind: genicam
        params:
          serial: null                # null -> first enumerated device
          ip: 192.168.188.30          # informational; GenTL discovers by itself
          pixel_format: BayerRG8
          cti_path: "C:/Program Files/Teledyne/Spinnaker/cti64/vs2015/Spinnaker_GenTL_v140.cti"
          stream_defaults: { rate_hz: 15.0, scale: 0.25, encoding: jpeg, quality: 75 }
      sim:
        # The headless-browser camera2d service renders the shared Three.js twin
        # scene and serves the contract over the bridge; launched OUTSIDE the
        # supervisor (launch: external), so it is never spawned as a child. The
        # render block is the ground-truth optics passed to the page.
        kind: headless_camera
        launch: external
        params:
          grab_defaults: { encoding: jpeg, quality: 90, scale: 1.0 }
      browser_sim:
        kind: browser_camera
        params:
          producer_lease_ttl_s: 10.0
          producer_max_payload_bytes: 8388608
          stream_defaults: { rate_hz: 15.0, scale: 0.25, encoding: jpeg, quality: 75 }
          grab_defaults: { encoding: jpeg, quality: 90, scale: 1.0 }
      replay:
        kind: replay_camera
        params:
          recording: deploy/recordings/demo.mcap
