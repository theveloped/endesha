[workspace]
name = "wf-platform"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

# Declare the glibc floor so cross-platform solving of the linux-64 env accepts
# the manylinux_2_28 wheels published for several deps (cbor2, opencv-python,
# pillow, eclipse-zenoh) instead of falling back to source builds. The Linux
# sim image (Ubuntu 22.04, glibc 2.35) satisfies this floor.
[system-requirements]
libc = { family = "glibc", version = "2.28" }

[dependencies]
python = "3.12.*"
pinocchio = ">=3.2"
coal = ">=3.0"

[pypi-dependencies]
eclipse-zenoh = "~=1.9.0"
cbor2 = "*"
uuid6 = "*"
numpy = "*"
pyyaml = "*"
opencv-python = "*"
trimesh = "*"
mcap = ">=1.1,<2"
# 0.19.4 restores published CPython 3.12 wheels. Pin it so a future source-only
# release cannot silently reintroduce native compilation in Linux images.
ruckig = "==0.19.4"
python-statemachine = ">=2.5"
asyncua = ">=1.1"
wf-core = { path = "packages/core", editable = true }
wf-world-model = { path = "packages/world_model", editable = true }
wf-contracts-control = { path = "packages/contracts/control", editable = true }
wf-contracts-arm = { path = "packages/contracts/arm", editable = true }
wf-contracts-dio = { path = "packages/contracts/dio", editable = true }
wf-contracts-tags = { path = "packages/contracts/tags", editable = true }
wf-contracts-washer = { path = "packages/contracts/washer", editable = true }
wf-contracts-program = { path = "packages/contracts/program", editable = true }
wf-program = { path = "packages/program", editable = true }
wf-services-program-runner = { path = "packages/services/program_runner", editable = true }
wf-contracts-camera2d = { path = "packages/contracts/camera2d", editable = true }
wf-hal-arm-core = { path = "packages/hal/arm_core", editable = true }
wf-hal-aubo-i10 = { path = "packages/hal/aubo_i10", editable = true }
wf-hal-arm-sim = { path = "packages/hal/arm_sim", editable = true }
wf-hal-channels-core = { path = "packages/hal/channels_core", editable = true }
wf-hal-dio-core = { path = "packages/hal/dio_core", editable = true }
wf-hal-sim-dio = { path = "packages/hal/sim_dio", editable = true }
wf-hal-tags-core = { path = "packages/hal/tags_core", editable = true }
wf-hal-sim-tags = { path = "packages/hal/sim_tags", editable = true }
wf-hal-opcua = { path = "packages/hal/opcua", editable = true }
wf-hal-ecoclean = { path = "packages/hal/ecoclean", editable = true }
wf-hal-camera2d-core = { path = "packages/hal/camera2d_core", editable = true }
wf-hal-replay = { path = "packages/hal/replay", editable = true }
wf-hal-browser-camera = { path = "packages/hal/browser_camera", editable = true }
wf-tools = { path = "packages/tools", editable = true }
wf-services-recording = { path = "packages/services/recording", editable = true }
wf-services-config = { path = "packages/services/config", editable = true }
wf-contracts-supervisor = { path = "packages/contracts/supervisor", editable = true }
wf-services-supervisor = { path = "packages/services/supervisor", editable = true }

[target.osx-64.dependencies]
# Ruckig 0.19.4 has no Intel macOS wheel. Keep its source-build toolchain scoped
# to that legacy target rather than installing compilers in every environment.
cmake = ">=3.15,<4"
ninja = "*"
scikit-build-core = ">=0.10"
nanobind = "*"

# GenICam camera HAL: vendor harvesters/genicam SDK ships no macOS cp312 wheels,
# so the camera driver is Windows/Linux only. The collision engine and every
# other package remain available on all four platforms.
[target.win-64.pypi-dependencies]
harvesters = "~=1.4"
wf-hal-genicam = { path = "packages/hal/genicam", editable = true }

[target.linux-64.pypi-dependencies]
harvesters = "~=1.4"
wf-hal-genicam = { path = "packages/hal/genicam", editable = true }

[pypi-options]
# Only Intel macOS builds Ruckig from source; other supported targets consume
# its published wheel.
no-build-isolation = ["ruckig"]

[environments]
default = { features = ["dev"], solve-group = "default" }

[feature.dev.pypi-dependencies]
pytest = ">=8"

[tasks]
test = "python -m pytest"
sync-assets = { cmd = "node scripts/sync-assets.mjs", cwd = "web" }
