[project]
name = "wf-platform"
version = "0.1.0"
description = "WF automation platform workspace root (virtual)"
requires-python = ">=3.12,<3.13"
# Env composition (deps, workspace members, dev group) lives in pixi.toml.

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "packages/core/tests",
    "packages/world_model/tests",
    "packages/contracts/control/tests",
    "packages/contracts/arm/tests",
    "packages/contracts/dio/tests",
    "packages/contracts/camera2d/tests",
    "packages/hal/arm_core/tests",
    "packages/hal/aubo_i10/tests",
    "packages/hal/arm_sim/tests",
    "packages/hal/dio_core/tests",
    "packages/hal/sim_dio/tests",
    "packages/hal/camera2d_core/tests",
    "packages/hal/replay/tests",
    "packages/hal/genicam/tests",
    "packages/hal/browser_camera/tests",
    "packages/services/recording/tests",
    "packages/services/config/tests",
    "packages/services/supervisor/tests",
    "packages/tools/tests",
]
